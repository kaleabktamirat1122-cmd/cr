<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Champion Properties | Client Recognition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-loading">
<main id="app">
  <section id="loading" class="screen" aria-live="polite">
    <p class="brand">Champion Properties</p>
    <div class="bar"><span></span></div>
    <p class="muted">Verifying your client recognition...</p>
  </section>

  <section id="result" class="screen card" hidden>
    <img id="badge" class="badge reveal" alt="" width="150" height="150">
    <p class="kicker reveal">CONGRATULATIONS!</p>
    <h1 id="title" class="reveal"></h1>
    <p id="name" class="name reveal"></p>
    <p id="message" class="message reveal"></p>
    <a id="cta" class="cta reveal" href="https://championpropertieset.com/" target="_blank" rel="noopener noreferrer">VISIT CHAMPION PROPERTIES</a>
  </section>
</main>
<script src="js/main.js"></script>
</body>
</html>
